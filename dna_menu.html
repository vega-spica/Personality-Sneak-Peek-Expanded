<section class="dna-container">

        <h3 class="dna-header">Color</h3>

            <label class="dna-label" for="partnereyecolourSearch">Eyes</label>
            <div class="dropdown dna-dropdown">
                <input type="text" class="search-box no-search" id="partnereyecolourSearch" autocomplete="off" readonly>
                <div class="dropdown-content" id="partnereyecolourDropdown"></div>
            </div>
            <select hidden id="partnereyecolour" name="partnereyecolour"
                    style="display: none;" aria-label="Partner Eye Colour"
